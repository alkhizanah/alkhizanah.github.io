<div class="{{ include.class }}" data-github-repo="{{ include.repo }}" hidden>
  <span class="stat" title="Stars">
    {% include icons/star.svg class="stat-icon" %}
    <span data-stat="stars"></span>
    <span class="visually-hidden">stars</span>
  </span>
  <span class="stat" title="Forks">
    {% include icons/fork.svg class="stat-icon" %}
    <span data-stat="forks"></span>
    <span class="visually-hidden">forks</span>
  </span>
</div>
